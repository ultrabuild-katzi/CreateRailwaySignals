
#.
#Settings for the Pre Light Signal block's train-proximity preview.
[preLightSignal]
	#.
	#How far ahead (in blocks, along the track graph) a Pre Light Signal looks for an automated train and the next speed boundary on its path before showing a number.
	#Range: 0 ~ 10000
	preLightSignalRange = 500

#.
#Settings for the optional Create Realism ETCS compat (speed signs shown on its HUD).
[realismCompat]
	#.
	#Margin (in km/h) added on top of a speed sign's actual limit when displayed on Create Realism's ETCS HUD, so it doesn't read as exceeded the instant the train is going exactly the posted limit.
	#Range: 0 ~ 50
	etcsHudSpeedBuffer = 2

